name = "kre8tion-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages configuration
pages_build_output_dir = ".vercel/output/static"

# KV Namespaces
[[kv_namespaces]]
binding = "VOICE_SESSIONS"
id = "23e84aa024414eeb9b5edb2b254bbe3b"
preview_id = "6b499353749648fea03b2bfdb007707d"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b7addbaac289495ba3cac09e573fe279"

[[kv_namespaces]]
binding = "COST_MONITOR_KV"
id = "6173089a0e644193b07e7419055f4c7a"

[[kv_namespaces]]
binding = "RESPONSE_CACHE_KV"
id = "cbef44c800ca49eb81e2b08b95f05d11"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }
kv_namespaces = [
  { binding = "VOICE_SESSIONS", id = "23e84aa024414eeb9b5edb2b254bbe3b" },
  { binding = "RATE_LIMIT_KV", id = "b7addbaac289495ba3cac09e573fe279" },
  { binding = "COST_MONITOR_KV", id = "6173089a0e644193b07e7419055f4c7a" },
  { binding = "RESPONSE_CACHE_KV", id = "cbef44c800ca49eb81e2b08b95f05d11" }
]

# Preview environment
[env.preview]
vars = { ENVIRONMENT = "preview" }
kv_namespaces = [
  { binding = "VOICE_SESSIONS", id = "6b499353749648fea03b2bfdb007707d" }
]
