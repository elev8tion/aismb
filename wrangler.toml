name = "kre8tion-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages configuration
pages_build_output_dir = ".vercel/output/static"

# KV Namespaces
[[kv_namespaces]]
binding = "VOICE_SESSIONS"
id = "f7b3080dbe754bbb9ad62cfd1c2f1cb4"
preview_id = "56da859da3c34b0ca0db9db04f94b6b1"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b6a9073764734bf2b7b56634f13ddd83"

[[kv_namespaces]]
binding = "COST_MONITOR_KV"
id = "3155bdd32f01439eab3e67d8bc281faa"

[[kv_namespaces]]
binding = "RESPONSE_CACHE_KV"
id = "d57cae66e7304561b142ae1b5f73b0e8"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }
kv_namespaces = [
  { binding = "VOICE_SESSIONS", id = "f7b3080dbe754bbb9ad62cfd1c2f1cb4" },
  { binding = "RATE_LIMIT_KV", id = "b6a9073764734bf2b7b56634f13ddd83" },
  { binding = "COST_MONITOR_KV", id = "3155bdd32f01439eab3e67d8bc281faa" },
  { binding = "RESPONSE_CACHE_KV", id = "d57cae66e7304561b142ae1b5f73b0e8" }
]

# Preview environment
[env.preview]
vars = { ENVIRONMENT = "preview" }
kv_namespaces = [
  { binding = "VOICE_SESSIONS", id = "56da859da3c34b0ca0db9db04f94b6b1" }
]
