name: Deploy CRM to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ai_smb_crm_frontend/**'
      - '.github/workflows/deploy-crm.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    defaults:
      run:
        working-directory: ai_smb_crm_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai_smb_crm_frontend/package-lock.json

      - name: Install CRM dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Configure CRM Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCB_INSTANCE: ${{ secrets.NCB_INSTANCE }}
          NCB_AUTH_API_URL: ${{ secrets.NCB_AUTH_API_URL }}
          NCB_DATA_API_URL: ${{ secrets.NCB_DATA_API_URL }}
          NCB_OPENAPI_URL: ${{ secrets.NCB_OPENAPI_URL }}
          NCB_SECRET_KEY: ${{ secrets.NCB_SECRET_KEY }}
          NCB_GUEST_KEY: ${{ secrets.NCB_GUEST_KEY }}
          EMAILIT_API_KEY: ${{ secrets.EMAILIT_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          case "$NCB_AUTH_API_URL" in
            https://app.nocodebackend.com/api/user-auth) ;;
            *) echo "NCB_AUTH_API_URL secret is not the production auth endpoint"; exit 1 ;;
          esac
          case "$NCB_DATA_API_URL" in
            https://app.nocodebackend.com/api/data) ;;
            *) echo "NCB_DATA_API_URL secret is not the production data endpoint"; exit 1 ;;
          esac
          put_secret() {
            value="$1"
            name="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@3.80.0 pages secret put "$name" --project-name=ai-smb-crm
            fi
          }
          put_secret "$OPENAI_API_KEY" OPENAI_API_KEY
          put_secret "$NCB_INSTANCE" NCB_INSTANCE
          put_secret "$NCB_AUTH_API_URL" NCB_AUTH_API_URL
          put_secret "$NCB_DATA_API_URL" NCB_DATA_API_URL
          put_secret "$NCB_OPENAPI_URL" NCB_OPENAPI_URL
          put_secret "$NCB_SECRET_KEY" NCB_SECRET_KEY
          put_secret "$NCB_GUEST_KEY" NCB_GUEST_KEY
          put_secret "$EMAILIT_API_KEY" EMAILIT_API_KEY
          put_secret "$ADMIN_EMAIL" ADMIN_EMAIL

      - name: Build CRM for Cloudflare Pages
        run: npm run pages:build

      - name: Deploy CRM
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.80.0'
          workingDirectory: ai_smb_crm_frontend
          command: pages deploy .vercel/output/static --project-name=ai-smb-crm --commit-dirty=true --no-bundle
