name: Audit Cloudflare Tokens

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory token metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS 'https://api.cloudflare.com/client/v4/user/tokens' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json')
          jq '{success, errors, result: [.result[] | {id, name, status, issued_on, modified_on}]}' <<<"$response"
