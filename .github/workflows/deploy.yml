name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ai_smb_crm_frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared-types package
        run: cd packages/shared-types && npm run build

      - name: Stamp deployed commit
        run: printf 'export const BUILD_SHA = "%s";\n' "$GITHUB_SHA" > lib/buildInfo.ts

      - name: Build Next.js
        run: npm run build

      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.80.0'
          command: pages deploy .vercel/output/static --project-name=kre8tion-app --commit-dirty=true

      - name: Refresh existing Pages secrets
        run: |
          put_secret() {
            value="$1"
            name="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler@3.80.0 pages secret put "$name" --project-name=kre8tion-app
            else
              echo "skip empty $name"
            fi
          }
          put_secret "$OPENAI_API_KEY" OPENAI_API_KEY
          put_secret "$NCB_INSTANCE" NCB_INSTANCE
          put_secret "$NCB_DATA_API_URL" NCB_DATA_API_URL
          put_secret "$NCB_AUTH_API_URL" NCB_AUTH_API_URL
          put_secret "$EMAILIT_API_KEY" EMAILIT_API_KEY
          put_secret "$ADMIN_EMAIL" ADMIN_EMAIL
          put_secret "$NCB_OPENAPI_URL" NCB_OPENAPI_URL
          put_secret "$NCB_SECRET_KEY" NCB_SECRET_KEY
          put_secret "$ADMIN_API_KEY" ADMIN_API_KEY
          put_secret "$NCB_GUEST_KEY" NCB_GUEST_KEY
          put_secret "$NCB_DEFAULT_USER_ID" NCB_DEFAULT_USER_ID
          put_secret true FF_VOICE_LEAD_EXTRACTION
          put_secret true FF_VOICE_LEAD_SCORING
          put_secret true FF_VOICE_CRM_SYNC
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCB_INSTANCE: ${{ secrets.NCB_INSTANCE }}
          NCB_DATA_API_URL: ${{ secrets.NCB_DATA_API_URL }}
          NCB_AUTH_API_URL: ${{ secrets.NCB_AUTH_API_URL }}
          EMAILIT_API_KEY: ${{ secrets.EMAILIT_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NCB_OPENAPI_URL: ${{ secrets.NCB_OPENAPI_URL }}
          NCB_SECRET_KEY: ${{ secrets.NCB_SECRET_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NCB_GUEST_KEY: ${{ secrets.NCB_GUEST_KEY }}
          NCB_DEFAULT_USER_ID: ${{ secrets.NCB_DEFAULT_USER_ID }}
